[package]
name = "soroban-cost-snapshot"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Per-function resource-cost snapshots for Soroban contracts, with a diff tool for pull requests."
readme = "README.md"
keywords = ["soroban", "stellar", "gas", "benchmark", "ci"]
categories = ["development-tools::testing"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "soroban-cost"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[workspace]
members = ["."]
exclude = ["examples/demo-contract"]
